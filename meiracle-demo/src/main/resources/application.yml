server:
  port: 9201
  servlet:
    context-path: /demo

spring:
  application:
    name: meiracle-demo
  # ===== 数据源（占位，生产请用配置中心/环境变量注入，切勿硬编码真实密码） =====
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/meiracle?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          username: ${DB_USER:meiracle}
          password: ${DB_PASSWORD:CHANGE_ME_db_pwd}
          driver-class-name: com.mysql.cj.jdbc.Driver
  # ===== Redis（Redisson，读取 spring.data.redis.*） =====
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:CHANGE_ME_redis_pwd}
      database: 0
      timeout: 3000ms

# ===== MyBatis-Plus =====
mybatis-plus:
  mapperPackage: cn.meiracle.demo.dao.mapper
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  typeAliasesPackage: cn.meiracle.demo.domain
  sql-log:
    enabled: false

# ===== Nacos（注册/配置中心，占位账号，生产请替换） =====
nacos:
  addr: ${NACOS_ADDR:127.0.0.1:8848}
  username: ${NACOS_USERNAME:nacos}
  password: ${NACOS_PASSWORD:CHANGE_ME_nacos_pwd}

# ===== Dubbo =====
dubbo:
  application:
    name: meiracle-demo
  protocol:
    name: dubbo
    port: 20880
  registry:
    address: nacos://${NACOS_ADDR:127.0.0.1:8848}
  scan:
    base-packages: cn.meiracle.demo.provider.remote
  consumer:
    check: false

# ===== 监控服务地址（demo -> monitor 变动上报；占位，部署时替换） =====
monitor:
  base-url: http://${MONITOR_HOST:127.0.0.1}:9211

logging:
  level:
    cn.meiracle: info
