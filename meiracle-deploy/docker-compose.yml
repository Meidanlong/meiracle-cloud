# ============================================================================
# meiracle-cloud 中间件编排
# ----------------------------------------------------------------------------
# 用法：
#   1) cp .env.example .env   &&   按需修改 .env 中所有 CHANGE_ME_* 为真实值
#   2) docker compose up -d
# 默认端口/账号均为占位，切勿直接用于生产。
# 初始化库表：见 init/init.sql（容器启动后会自动执行 /docker-entrypoint-initdb.d 下的 SQL）。
# Nacos 配置导入：见 nacos/config-import.yaml 与 nacos/import.sh。
# ============================================================================

name: meiracle-cloud

services:
  # ===================== MySQL =====================
  mysql:
    image: mysql:8.0
    container_name: meiracle-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-CHANGE_ME_mysql_root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-meiracle}"
      MYSQL_USER: "${MYSQL_USER:-meiracle}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-CHANGE_ME_db_pwd}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-CHANGE_ME_mysql_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===================== Redis =====================
  redis:
    image: redis:7-alpine
    container_name: meiracle-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-CHANGE_ME_redis_pwd}"
      --appendonly yes
    volumes:
      - redis-data:/data

  # ===================== Nacos (注册/配置中心) =====================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: meiracle-nacos
    restart: unless-stopped
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: "${NACOS_AUTH_IDENTITY_KEY:-CHANGE_ME_nacos_identity_key}"
      NACOS_AUTH_IDENTITY_VALUE: "${NACOS_AUTH_IDENTITY_VALUE:-CHANGE_ME_nacos_identity_value}"
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN:-CHANGE_ME_nacos_auth_token}"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ===================== MinIO (对象存储，可选) =====================
  minio:
    image: minio/minio:latest
    container_name: meiracle-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-CHANGE_ME_minio_access}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-CHANGE_ME_minio_secret}"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # ===================== Nexus3 (Maven 私服，可选) =====================
  nexus:
    image: sonatype/nexus3:latest
    container_name: meiracle-nexus
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-8081}:8081"
    environment:
      TZ: Asia/Shanghai
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx3g"
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/"]
      interval: 30s
      timeout: 5s
      retries: 20

  # ===================== Seata (分布式事务，可选) =====================
  seata:
    image: seataio/seata-server:2.0.0
    container_name: meiracle-seata
    restart: unless-stopped
    ports:
      - "${SEATA_PORT:-8091}:8091"
      - "${SEATA_CONSOLE_PORT:-7091}:7091"
    environment:
      TZ: Asia/Shanghai
      SEATA_IP: "${SEATA_IP:-127.0.0.1}"
      SEATA_PORT: "${SEATA_PORT:-8091}"
      SEATA_CONFIG_TYPE: file
    volumes:
      - seata-data:/seata-server/resources

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
  minio-data:
  nexus-data:
  seata-data:
